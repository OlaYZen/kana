<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Kana Practice">
  <title>Kana Practice</title>

  <!-- Washi ground, full bleed: no transparent corners, so the icon still reads
       when a platform masks it to a circle or a squircle. -->
  <rect width="512" height="512" fill="#EFE9DC"/>

  <!-- The practice square — a genkou-youshi writing box with its faint dashed
       cross guides, the same frame the app draws a character inside. Kept low
       in contrast on purpose: texture at large sizes, and at 16px it fades out
       instead of turning the glyph to mush. -->
  <rect x="44.5" y="44.5" width="423" height="423" rx="26"
        fill="none" stroke="#D8D0BC" stroke-width="3"/>
  <g stroke="#C8BFA6" stroke-width="3" stroke-linecap="round"
     stroke-dasharray="14 14" opacity="0.5">
    <line x1="92" y1="256" x2="420" y2="256"/>
    <line x1="256" y1="92" x2="256" y2="420"/>
  </g>

  <!-- Hiragana A, the first character of the gojuuon and the app's own sample
       glyph. Outlined from Noto Serif CJK JP SemiBold rather than set as <text>:
       an icon must not depend on a font being installed, and a serif face at
       Regular weight breaks up at favicon sizes. The glyph is centred on its own
       bounding box, not on the advance width, so it sits true in the square. -->
