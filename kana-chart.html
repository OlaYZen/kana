<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kana chart — Hiragana & Katakana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE9DC;
  --paper-card:#FBF8F1;
  --ink:#24211C;
  --ink-soft:#5B564C;
  --hairline:#D8D0BC;
  --shu:#B23A26;
  --shu-dark:#7E2717;
  --ai:#2B4570;
  --ai-dark:#1B2C47;
  --gap-empty:#E3DCC9;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;}
.wrap{max-width:1000px;margin:0 auto;padding:48px 24px 80px;}
.masthead{text-align:center;margin-bottom:8px;}
.masthead h1{
  font-family:'Noto Serif JP',serif;
  font-weight:600;
  font-size:44px;
  margin:0;
  letter-spacing:0.02em;
}
.masthead p{
  margin:6px 0 0;
  color:var(--ink-soft);
  font-size:14px;
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.hanko-row{display:flex;justify-content:center;gap:14px;margin:32px 0 40px;}
.hanko{
  position:relative;
  width:120px;height:120px;
  border-radius:8px;
  border:2px solid transparent;
  background:var(--paper-card);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Noto Serif JP',serif;
  transition:transform .15s ease, box-shadow .15s ease;
}
.hanko .glyph{font-size:38px;line-height:1;color:var(--ink);}
.hanko .label{margin-top:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;letter-spacing:.04em;color:var(--ink-soft);}
.hanko.active{border-color:currentColor;box-shadow:0 0 0 3px var(--paper) inset;transform:rotate(-1.5deg);}
.hanko.active.hira{color:var(--shu);}
.hanko.active.hira .glyph{color:var(--shu);}
.hanko.active.hira .label{color:var(--shu-dark);}
.hanko.active.kata{color:var(--ai);}
.hanko.active.kata .glyph{color:var(--ai);}
.hanko.active.kata .label{color:var(--ai-dark);}
.hanko:not(.active):hover{transform:translateY(-2px);}

section.block{margin-bottom:44px;}
.block h2{
  font-family:'Noto Serif JP',serif;
  font-weight:600;
  font-size:20px;
  margin:0 0 4px;
  padding-bottom:8px;
  border-bottom:1px solid var(--hairline);
  display:flex;align-items:baseline;gap:10px;
}
.block h2 .en{font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:400;color:var(--ink-soft);letter-spacing:.03em;}

.kgrid{
  display:grid;
  grid-template-columns:56px repeat(5,1fr);
  gap:4px;
  margin-top:14px;
}
.kgrid .colhead{
  text-align:center;font-size:12px;color:var(--ink-soft);
  font-family:'JetBrains Mono',monospace;padding-bottom:2px;
}
.rowhead{
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);
}
.cell{
  background:var(--paper-card);
  border:1px solid var(--hairline);
  border-radius:6px;
  min-height:74px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 2px;
}
.cell .kana{font-family:'Noto Serif JP',serif;font-size:26px;line-height:1;}
.cell .romaji{margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.02em;}
.cell.empty{background:var(--gap-empty);border-style:dashed;}
.cell.single{grid-column:2/3;}

.ygrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:4px;
  margin-top:14px;
}
.ygrid .cell{min-height:68px;}
.ygrid .cell .kana{font-size:22px;}

footer{margin-top:56px;text-align:center;font-size:12px;color:var(--ink-soft);}
footer .seal{
  display:inline-block;margin-bottom:10px;
  font-family:'Noto Serif JP',serif;font-size:13px;
  border:1px solid var(--shu);color:var(--shu);
  padding:4px 10px;border-radius:4px;
}

@media (max-width:640px){
  .masthead h1{font-size:32px;}
  .kgrid{grid-template-columns:40px repeat(5,1fr);}
  .cell .kana{font-size:20px;}
  .hanko{width:96px;height:96px;}
  .hanko .glyph{font-size:30px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1 id="title">ひらがな</h1>
    <p id="subtitle">Hiragana — the complete syllabary</p>
  </div>

  <div class="hanko-row">
    <div class="hanko hira active" data-script="hira">
      <div class="glyph">あ</div>
      <div class="label">Hiragana</div>
    </div>
    <div class="hanko kata" data-script="kata">
      <div class="glyph">ア</div>
      <div class="label">Katakana</div>
    </div>
  </div>

  <div id="content"></div>

  <footer>
    <div class="seal">五十音</div>
    <div>Gojūon reference · rows follow Wikipedia's standard ordering</div>
  </footer>
</div>

<script>
const V = ["a","i","u","e","o"];

const hiraBasic = [
  ["","あ","い","う","え","お"],
  ["k","か","き","く","け","こ"],
  ["s","さ","し","す","せ","そ"],
  ["t","た","ち","つ","て","と"],
  ["n","な","に","ぬ","ね","の"],
  ["h","は","ひ","ふ","へ","ほ"],
  ["m","ま","み","む","め","も"],
  ["y","や","","ゆ","","よ"],
  ["r","ら","り","る","れ","ろ"],
  ["w","わ","","","","を"],
];
const hiraRomaji = [
  ["","a","i","u","e","o"],
  ["k","ka","ki","ku","ke","ko"],
  ["s","sa","shi","su","se","so"],
  ["t","ta","chi","tsu","te","to"],
  ["n","na","ni","nu","ne","no"],
  ["h","ha","hi","fu","he","ho"],
  ["m","ma","mi","mu","me","mo"],
  ["y","ya","","yu","","yo"],
  ["r","ra","ri","ru","re","ro"],
  ["w","wa","","","","wo"],
];
const hiraN = ["ん","n"];

const hiraVoiced = [
  ["g","が","ぎ","ぐ","げ","ご"],["", "ga","gi","gu","ge","go"],
  ["z","ざ","じ","ず","ぜ","ぞ"],["", "za","ji","zu","ze","zo"],
  ["d","だ","ぢ","づ","で","ど"],["", "da","ji","zu","de","do"],
  ["b","ば","び","ぶ","べ","ぼ"],["", "ba","bi","bu","be","bo"],
];
const hiraSemi = [
  ["p","ぱ","ぴ","ぷ","ぺ","ぽ"],["", "pa","pi","pu","pe","po"],
];

const hiraYoon = [
  ["きゃ","kya"],["きゅ","kyu"],["きょ","kyo"],
  ["しゃ","sha"],["しゅ","shu"],["しょ","sho"],
  ["ちゃ","cha"],["ちゅ","chu"],["ちょ","cho"],
  ["にゃ","nya"],["にゅ","nyu"],["にょ","nyo"],
  ["ひゃ","hya"],["ひゅ","hyu"],["ひょ","hyo"],
  ["みゃ","mya"],["みゅ","myu"],["みょ","myo"],
  ["りゃ","rya"],["りゅ","ryu"],["りょ","ryo"],
  ["ぎゃ","gya"],["ぎゅ","gyu"],["ぎょ","gyo"],
  ["じゃ","ja"],["じゅ","ju"],["じょ","jo"],
  ["びゃ","bya"],["びゅ","byu"],["びょ","byo"],
  ["ぴゃ","pya"],["ぴゅ","pyu"],["ぴょ","pyo"],
];

const kataBasic = [
  ["","ア","イ","ウ","エ","オ"],
  ["k","カ","キ","ク","ケ","コ"],
  ["s","サ","シ","ス","セ","ソ"],
  ["t","タ","チ","ツ","テ","ト"],
  ["n","ナ","ニ","ヌ","ネ","ノ"],
  ["h","ハ","ヒ","フ","ヘ","ホ"],
  ["m","マ","ミ","ム","メ","モ"],
  ["y","ヤ","","ユ","","ヨ"],
  ["r","ラ","リ","ル","レ","ロ"],
  ["w","ワ","","","","ヲ"],
];
const kataN = ["ン","n"];

const kataVoiced = [
  ["g","ガ","ギ","グ","ゲ","ゴ"],["", "ga","gi","gu","ge","go"],
  ["z","ザ","ジ","ズ","ゼ","ゾ"],["", "za","ji","zu","ze","zo"],
  ["d","ダ","ヂ","ヅ","デ","ド"],["", "da","ji","zu","de","do"],
  ["b","バ","ビ","ブ","ベ","ボ"],["", "ba","bi","bu","be","bo"],
];
const kataSemi = [
  ["p","パ","ピ","プ","ペ","ポ"],["", "pa","pi","pu","pe","po"],
];

const kataYoon = [
  ["キャ","kya"],["キュ","kyu"],["キョ","kyo"],
  ["シャ","sha"],["シュ","shu"],["ショ","sho"],
  ["チャ","cha"],["チュ","chu"],["チョ","cho"],
  ["ニャ","nya"],["ニュ","nyu"],["ニョ","nyo"],
  ["ヒャ","hya"],["ヒュ","hyu"],["ヒョ","hyo"],
  ["ミャ","mya"],["ミュ","myu"],["ミョ","myo"],
  ["リャ","rya"],["リュ","ryu"],["リョ","ryo"],
  ["ギャ","gya"],["ギュ","gyu"],["ギョ","gyo"],
  ["ジャ","ja"],["ジュ","ju"],["ジョ","jo"],
  ["ビャ","bya"],["ビュ","byu"],["ビョ","byo"],
  ["ピャ","pya"],["ピュ","pyu"],["ピョ","pyo"],
];

const kataExtended = [
  ["イェ","ye"],
  ["ウィ","wi"],["ウェ","we"],["ウォ","wo"],
  ["ヴァ","va"],["ヴィ","vi"],["ヴ","vu"],["ヴェ","ve"],["ヴォ","vo"],
  ["シェ","she"],["ジェ","je"],["チェ","che"],
  ["ティ","ti"],["トゥ","tu"],["ディ","di"],["ドゥ","du"],
  ["ツァ","tsa"],["ツィ","tsi"],["ツェ","tse"],["ツォ","tso"],
  ["ファ","fa"],["フィ","fi"],["フェ","fe"],["フォ","fo"],["フュ","fyu"],
];

function basicGrid(basic){
  let rows = "";
  rows += `<div class="colhead"></div>` + V.map(v=>`<div class="colhead">${v}</div>`).join("");
  basic.forEach(row=>{
    rows += `<div class="rowhead">${row[0]}</div>`;
    for(let i=1;i<=5;i++){
      const romajiRow = row[0]==="" ? V : row.map(()=>"");
      const kana = row[i];
      if(kana===""){ rows += `<div class="cell empty"></div>`; continue; }
      const romaji = romajiFor(row[0], V[i-1]);
      rows += `<div class="cell"><div class="kana">${kana}</div><div class="romaji">${romaji}</div></div>`;
    }
  });
  return `<div class="kgrid">${rows}</div>`;
}

function romajiFor(cons, vowel){
  const map = {
    "":vowel,
    k:"k"+vowel, s: vowel==="i"?"shi":vowel==="u"?"su":"s"+vowel,
    t: vowel==="i"?"chi":vowel==="u"?"tsu":"t"+vowel,
    n:"n"+vowel, h: vowel==="u"?"fu":"h"+vowel,
    m:"m"+vowel, y:"y"+vowel, r:"r"+vowel, w:"w"+vowel,
  };
  return map[cons] ?? (cons+vowel);
}

function voicedGrid(pairs){
  let rows = "";
  rows += `<div class="colhead"></div>` + V.map(v=>`<div class="colhead">${v}</div>`).join("");
  for(let i=0;i<pairs.length;i+=2){
    const kanaRow = pairs[i];
    const romRow = pairs[i+1];
    rows += `<div class="rowhead">${kanaRow[0]}</div>`;
    for(let j=1;j<=5;j++){
      rows += `<div class="cell"><div class="kana">${kanaRow[j]}</div><div class="romaji">${romRow[j]}</div></div>`;
    }
  }
  return `<div class="kgrid">${rows}</div>`;
}

function nGrid(pair, label){
  return `<div class="kgrid" style="grid-template-columns:1fr;max-width:120px;">
    <div class="cell"><div class="kana">${pair[0]}</div><div class="romaji">${pair[1]}</div></div>
  </div>`;
}

function yoonGrid(list){
  const cells = list.map(([kana,rom])=>
    `<div class="cell"><div class="kana">${kana}</div><div class="romaji">${rom}</div></div>`
  ).join("");
  return `<div class="ygrid">${cells}</div>`;
}

function render(script){
  const isHira = script === "hira";
  document.getElementById("title").textContent = isHira ? "ひらがな" : "カタカナ";
  document.getElementById("subtitle").textContent = isHira
    ? "Hiragana — the complete syllabary"
    : "Katakana — the complete syllabary";

  const basic = isHira ? hiraBasic : kataBasic;
  const nPair = isHira ? hiraN : kataN;
  const voiced = isHira ? hiraVoiced : kataVoiced;
  const semi = isHira ? hiraSemi : kataSemi;
  const yoon = isHira ? hiraYoon : kataYoon;

  let html = "";
  html += `<section class="block"><h2>Gojūon <span class="en">basic 46 sounds</span></h2>${basicGrid(basic)}
    <div style="margin-top:8px;">${nGrid(nPair)}</div></section>`;
  html += `<section class="block"><h2>Dakuten <span class="en">voiced sounds</span></h2>${voicedGrid(voiced)}</section>`;
  html += `<section class="block"><h2>Handakuten <span class="en">semi-voiced sounds</span></h2>${voicedGrid(semi)}</section>`;
  html += `<section class="block"><h2>Yōon <span class="en">contracted sounds</span></h2>${yoonGrid(yoon)}</section>`;
  if(!isHira){
    html += `<section class="block"><h2>Extended katakana <span class="en">for foreign loanwords</span></h2>${yoonGrid(kataExtended)}</section>`;
  }
  document.getElementById("content").innerHTML = html;
}

document.querySelectorAll(".hanko").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".hanko").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.script);
  });
});

render("hira");
</script>
</body>
</html>
