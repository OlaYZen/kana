<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カナ — Katakana Practice</title>
<style>
  :root{
    --kon:      #17263F;  /* deep indigo ground */
    --kon-2:    #223451;  /* raised indigo panel */
    --kon-line: #33486A;  /* hairline on indigo */
    --washi:    #F2ECDB;  /* paper card */
    --washi-2:  #E7DFC9;  /* paper shade */
    --sumi:     #24221D;  /* ink */
    --sumi-2:   #6A6455;  /* muted ink */
    --shu:      #DE4A3B;  /* vermilion / seal red */
    --matcha:   #6E8E3A;  /* correct green */
    --brass:    #C79A3C;  /* streak gold */
    --guide:    #C8BFA6;  /* practice-square cross guides */

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Songti SC", serif;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--washi);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1E3150 0%, transparent 60%),
      var(--kon);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    -webkit-font-smoothing:antialiased;
  }

  .stage{ width:100%; max-width:440px; }

  /* ---- header ---- */
  .eyebrow{
    display:flex; align-items:baseline; gap:10px;
    justify-content:center;
    margin:0 0 20px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:#9FB1CC;
  }
  .eyebrow .mark{
    font-family:var(--mincho);
    font-size:19px;
    letter-spacing:0;
    text-transform:none;
    color:var(--washi);
  }

  /* ---- practice square (genkō-yōshi) ---- */
  .square-wrap{ position:relative; display:flex; justify-content:center; }
  .square{
    position:relative;
    width:min(72vw,268px);
    aspect-ratio:1/1;
    background:linear-gradient(180deg,var(--washi) 0%, var(--washi-2) 140%);
    border-radius:10px;
    box-shadow:
      0 18px 40px -18px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* faint cross guides of the writing box */
  .square::before,.square::after{
    content:""; position:absolute; background:
      repeating-linear-gradient(var(--dir), var(--guide) 0 6px, transparent 6px 12px);
    opacity:.55;
  }
  .square::before{ --dir:to right;  left:8%; right:8%; top:50%; height:1px; }
  .square::after { --dir:to bottom; top:8%; bottom:8%; left:50%; width:1px; }

  .glyph{
    font-size:min(38vw,148px);
    line-height:1;
    color:var(--sumi);
    position:relative; z-index:1;
    user-select:none;
  }

  /* teacher's red 〇 correct stamp */
  .maru{
    position:absolute; inset:0; margin:auto;
    width:78%; height:78%;
    border:7px solid var(--shu);
    border-radius:50%;
    opacity:0; transform:scale(.4) rotate(-8deg);
    z-index:2; pointer-events:none;
    box-shadow:0 0 0 1px rgba(222,74,59,.25);
  }
  .square.correct .maru{ animation:stamp .5s cubic-bezier(.2,1.3,.4,1) forwards; }
  @keyframes stamp{
    0%{ opacity:0; transform:scale(.4) rotate(-8deg); }
    55%{ opacity:1; transform:scale(1.06) rotate(2deg); }
    100%{ opacity:.92; transform:scale(1) rotate(0); }
  }
  .square.wrong{ animation:shake .32s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

  /* ---- feedback line ---- */
  .feedback{
    text-align:center;
    min-height:26px;
    margin:16px 0 14px;
    font-size:15px;
    color:#B7C4DA;
  }
  .feedback b{ font-family:var(--mincho); font-size:19px; }
  .feedback .ok{ color:#A9C46C; }
  .feedback .no{ color:#F0897E; }

  /* ---- type mode ---- */
  .answer{ display:flex; gap:8px; }
  .answer input{
    flex:1; min-width:0;
    font-family:var(--sans);
    font-size:20px;
    padding:14px 16px;
    color:var(--washi);
    background:var(--kon-2);
    border:1px solid var(--kon-line);
    border-radius:10px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .answer input::placeholder{ color:#7286A3; }
  .answer input:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(199,154,60,.22); }
  .btn{
    font-family:var(--sans); font-size:15px; font-weight:600;
    padding:0 20px; border-radius:10px; cursor:pointer;
    border:1px solid transparent; white-space:nowrap;
    transition:transform .06s, background .15s, border-color .15s;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--shu); color:#fff; }
  .btn-primary:hover{ background:#E85C4D; }
  .btn-ghost{ background:transparent; color:#AEBED6; border-color:var(--kon-line); }
  .btn-ghost:hover{ border-color:#5A7096; color:var(--washi); }

  /* ---- choose mode ---- */
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice{
    font-family:var(--sans); font-size:19px; font-weight:600;
    padding:16px 10px; border-radius:10px; cursor:pointer;
    background:var(--washi); color:var(--sumi);
    border:1px solid rgba(0,0,0,.08);
    transition:transform .06s, background .15s, color .15s;
  }
  .choice .key{ font-size:11px; color:var(--sumi-2); display:block; margin-bottom:2px; font-weight:700; }
  .choice:hover{ background:#fff; }
  .choice:active{ transform:translateY(1px); }
  .choice.pick-ok{ background:var(--matcha); color:#fff; border-color:transparent; }
  .choice.pick-ok .key{ color:rgba(255,255,255,.8); }
  .choice.pick-no{ background:var(--shu); color:#fff; border-color:transparent; }
  .choice.pick-no .key{ color:rgba(255,255,255,.8); }
  .choice.reveal-ok{ box-shadow:0 0 0 3px var(--matcha) inset; }
  .choice:disabled{ cursor:default; }

  .undertools{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .link{ background:none; border:none; color:#8DA0BE; font-size:13.5px; cursor:pointer; padding:6px 2px; font-family:var(--sans); }
  .link:hover{ color:var(--washi); text-decoration:underline; }

  /* ---- stats ---- */
  .stats{ margin-top:26px; border-top:1px solid var(--kon-line); padding-top:16px; }
  .bar{ height:5px; background:var(--kon-2); border-radius:3px; overflow:hidden; }
  .bar > span{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brass),#E4C25E); transition:width .3s ease; }
  .metrics{ display:flex; justify-content:space-between; margin-top:12px; }
  .metric{ text-align:center; flex:1; }
  .metric .n{ font-family:var(--mincho); font-size:22px; color:var(--washi); }
  .metric .n small{ font-size:13px; color:var(--sumi-2); }
  .metric .l{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#8598B6; margin-top:2px; }
  .metric.streak .n{ color:var(--brass); }

  /* ---- footer ---- */
  footer{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
  .seg{ display:inline-flex; background:var(--kon-2); border:1px solid var(--kon-line); border-radius:9px; padding:3px; gap:2px; }
  .seg button{ font-family:var(--sans); font-size:13px; font-weight:600; color:#9FB1CC; background:none; border:none; padding:7px 13px; border-radius:7px; cursor:pointer; }
  .seg button.on{ background:var(--washi); color:var(--sumi); }

  /* ---- end screen ---- */
  .end{ text-align:center; }
  .end h2{ font-family:var(--mincho); font-weight:400; font-size:26px; margin:0 0 4px; }
  .end .score{ font-family:var(--mincho); font-size:60px; color:var(--brass); line-height:1; margin:14px 0 2px; }
  .end .sub{ color:#9FB1CC; font-size:14px; }
  .missed-title{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8598B6; margin:26px 0 12px; }
  .missed-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .miss{ background:var(--washi); color:var(--sumi); border-radius:8px; padding:8px 6px; width:58px; }
  .miss .k{ font-family:var(--mincho); font-size:26px; display:block; }
  .miss .r{ font-size:12px; color:var(--shu); font-weight:700; margin-top:2px; }
  .end-actions{ display:flex; flex-direction:column; gap:10px; margin-top:26px; }
  .end-actions .btn{ padding:14px; }

  .hidden{ display:none !important; }

  @media (max-width:380px){
    .metric .n{ font-size:19px; }
    .choice{ font-size:17px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
<main class="stage">

  <!-- PLAY -->
  <section id="play">
    <p class="eyebrow"><span class="mark">カナ</span> Katakana Practice</p>

    <div class="square-wrap">
      <div class="square" id="square">
        <span class="glyph" id="glyph">ア</span>
        <span class="maru" aria-hidden="true"></span>
      </div>
    </div>

    <p class="feedback" id="feedback" aria-live="polite">Type the sound this character makes.</p>

    <!-- type mode -->
    <div id="typeMode">
      <div class="answer">
        <input id="input" type="text" inputmode="latin" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="romaji…" aria-label="Type the romaji reading">
        <button class="btn btn-primary" id="submitBtn">Check</button>
      </div>
      <div class="undertools">
        <button class="link" id="revealBtn">Reveal answer</button>
        <span class="link" style="cursor:default;color:#6C7F9D;">Enter ↵ to check</span>
      </div>
    </div>

    <!-- choose mode -->
    <div id="chooseMode" class="hidden">
      <div class="choices" id="choices"></div>
    </div>

    <div class="stats">
      <div class="bar"><span id="barFill"></span></div>
      <div class="metrics">
        <div class="metric"><div class="n" id="mProgress">0<small>/45</small></div><div class="l">Seen</div></div>
        <div class="metric streak"><div class="n" id="mStreak">0</div><div class="l">Streak</div></div>
        <div class="metric"><div class="n" id="mAcc">—</div><div class="l">Accuracy</div></div>
      </div>
    </div>

    <footer>
      <div class="seg" role="group" aria-label="Answer mode">
        <button id="modeType" class="on">Type</button>
        <button id="modeChoose">Choose</button>
      </div>
      <button class="link" id="restartBtn">Restart deck</button>
    </footer>
  </section>

  <!-- END -->
  <section id="end" class="end hidden">
    <p class="eyebrow"><span class="mark">カナ</span> Deck complete</p>
    <div class="score" id="endScore">—</div>
    <p class="sub" id="endSub"></p>
    <div id="missedBlock">
      <p class="missed-title">Review these</p>
      <div class="missed-grid" id="missedGrid"></div>
    </div>
    <div class="end-actions">
      <button class="btn btn-ghost hidden" id="drillBtn"></button>
      <button class="btn btn-primary" id="againBtn">Practice all 45 again</button>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  // Exactly the 45 characters from the chart (no ん). Accepted answers include common romanization variants.
  const KANA = [
    ["ア","a"],["イ","i"],["ウ","u"],["エ","e"],["オ","o"],
    ["カ","ka"],["キ","ki"],["ク","ku"],["ケ","ke"],["コ","ko"],
    ["サ","sa"],["シ","shi",["si"]],["ス","su"],["セ","se"],["ソ","so"],
    ["タ","ta"],["チ","chi",["ti"]],["ツ","tsu",["tu"]],["テ","te"],["ト","to"],
    ["ナ","na"],["ニ","ni"],["ヌ","nu"],["ネ","ne"],["ノ","no"],
    ["ハ","ha"],["ヒ","hi"],["フ","fu",["hu"]],["ヘ","he"],["ホ","ho"],
    ["マ","ma"],["ミ","mi"],["ム","mu"],["メ","me"],["モ","mo"],
    ["ヤ","ya"],["ユ","yu"],["ヨ","yo"],
    ["ラ","ra"],["リ","ri"],["ル","ru"],["レ","re"],["ロ","ro"],
    ["ワ","wa"],["ヲ","wo",["o"]]
  ].map(([k,r,alt])=>({k, r, accept:[r].concat(alt||[])}));

  const $ = id => document.getElementById(id);
  const el = {
    play:$("play"), end:$("end"),
    square:$("square"), glyph:$("glyph"), feedback:$("feedback"),
    typeMode:$("typeMode"), chooseMode:$("chooseMode"),
    input:$("input"), submitBtn:$("submitBtn"), revealBtn:$("revealBtn"),
    choices:$("choices"),
    barFill:$("barFill"), mProgress:$("mProgress"), mStreak:$("mStreak"), mAcc:$("mAcc"),
    modeType:$("modeType"), modeChoose:$("modeChoose"), restartBtn:$("restartBtn"),
    endScore:$("endScore"), endSub:$("endSub"), missedBlock:$("missedBlock"),
    missedGrid:$("missedGrid"), drillBtn:$("drillBtn"), againBtn:$("againBtn")
  };

  let deck=[], i=0, mode="type";
  let answered=0, correct=0, streak=0, best=0;
  let missed=[];              // entries answered wrong (with dupes possible on drills)
  let locked=false;           // true after wrong/reveal — waiting to continue
  let currentWasWrong=false;

  const shuffle = a => { a=a.slice(); for(let j=a.length-1;j>0;j--){const t=Math.floor(Math.random()*(j+1));[a[j],a[t]]=[a[t],a[j]];} return a; };
  const norm = s => s.toLowerCase().trim().replace(/\s+/g,"");

  function start(pool){
    deck = shuffle(pool && pool.length ? pool : KANA);
    i=0; answered=0; correct=0; streak=0; best=0; missed=[];
    el.mProgress.querySelector("small") ? null : null;
    el.end.classList.add("hidden");
    el.play.classList.remove("hidden");
    updateStats();
    render();
  }

  function current(){ return deck[i]; }

  function render(){
    locked=false; currentWasWrong=false;
    const c = current();
    el.square.classList.remove("correct","wrong");
    el.glyph.textContent = c.k;
    el.feedback.innerHTML = "Type the sound this character makes.";
    el.mProgress.innerHTML = i + '<small>/'+deck.length+'</small>';

    if(mode==="type"){
      el.typeMode.classList.remove("hidden");
      el.chooseMode.classList.add("hidden");
      el.input.value="";
      el.input.disabled=false;
      el.submitBtn.textContent="Check";
      el.revealBtn.classList.remove("hidden");
      el.input.focus();
    }else{
      el.typeMode.classList.add("hidden");
      el.chooseMode.classList.remove("hidden");
      buildChoices(c);
    }
  }

  function buildChoices(c){
    const others = shuffle(KANA.filter(x=>x.r!==c.r)).slice(0,3);
    const opts = shuffle(others.concat(c));
    el.choices.innerHTML="";
    opts.forEach((o,idx)=>{
      const b=document.createElement("button");
      b.className="choice"; b.type="button";
      b.dataset.r=o.r;
      b.innerHTML='<span class="key">'+(idx+1)+'</span>'+o.r;
      b.addEventListener("click",()=>pickChoice(b,o,c));
      el.choices.appendChild(b);
    });
  }

  function updateStats(){
    el.mStreak.textContent = streak;
    el.mAcc.textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
    const done = Math.min(i, deck.length);
    el.barFill.style.width = deck.length ? (done/deck.length*100)+"%" : "0%";
  }

  // ---------- type mode ----------
  function submitType(){
    if(locked){ next(); return; }
    const val = norm(el.input.value);
    if(!val) return;
    const c = current();
    if(c.accept.some(a=>a===val)) markCorrect();
    else markWrong(c);
  }

  function reveal(){
    if(locked) return;
    markWrong(current(), true);
  }

  // ---------- choose mode ----------
  function pickChoice(btn,opt,c){
    if(locked) return;
    Array.from(el.choices.children).forEach(b=>b.disabled=true);
    if(opt.r===c.r){ btn.classList.add("pick-ok"); markCorrect(); }
    else{
      btn.classList.add("pick-no");
      const right = Array.from(el.choices.children).find(b=>b.dataset.r===c.r);
      if(right) right.classList.add("reveal-ok");
      markWrong(c);
    }
  }

  // ---------- scoring ----------
  function markCorrect(){
    answered++; correct++; streak++; best=Math.max(best,streak);
    el.square.classList.add("correct");
    el.feedback.innerHTML = '<span class="ok">Correct — <b>'+current().k+'</b> is “'+current().r+'”.</span>';
    if(mode==="type"){ el.input.disabled=true; }
    updateStats();
    locked=true; currentWasWrong=false;
    setTimeout(next, 620);
  }

  function markWrong(c, viaReveal){
    if(!currentWasWrong){ answered++; missed.push(c); }
    streak=0; currentWasWrong=true;
    el.square.classList.remove("correct");
    el.square.classList.add("wrong");
    el.feedback.innerHTML = (viaReveal ? '' : '<span class="no">Not quite. </span>') +
      '<b>'+c.k+'</b> is “<span class="no">'+c.r+'</span>”. '+
      (mode==="type" ? 'Press Enter to continue.' : 'Tap continue below.');
    updateStats();
    locked=true;
    if(mode==="type"){
      el.input.value=c.r; el.input.disabled=false; el.input.select();
      el.submitBtn.textContent="Next →";
      el.input.focus();
    }else{
      showContinueChoice();
    }
  }

  function showContinueChoice(){
    // repurpose the choices area with a single continue button
    const bar=document.createElement("div");
    bar.style.gridColumn="1 / -1";
    const b=document.createElement("button");
    b.className="btn btn-primary"; b.type="button"; b.textContent="Continue →";
    b.style.width="100%"; b.style.padding="14px";
    b.addEventListener("click",next);
    bar.appendChild(b); el.choices.appendChild(bar);
    b.focus();
  }

  function next(){
    i++;
    if(i>=deck.length){ finish(); return; }
    updateStats();
    render();
  }

  // ---------- end ----------
  function finish(){
    el.play.classList.add("hidden");
    el.end.classList.remove("hidden");
    const acc = answered ? Math.round(correct/answered*100) : 0;
    el.endScore.textContent = acc+"%";
    el.endSub.textContent = correct+" of "+answered+" right · longest streak "+best;

    // unique missed, in chart order
    const seen=new Set(), uniqMissed=[];
    KANA.forEach(k=>{ if(missed.some(m=>m.k===k.k)&&!seen.has(k.k)){ seen.add(k.k); uniqMissed.push(k); }});

    if(uniqMissed.length){
      el.missedBlock.classList.remove("hidden");
      el.missedGrid.innerHTML="";
      uniqMissed.forEach(k=>{
        const d=document.createElement("div"); d.className="miss";
        d.innerHTML='<span class="k">'+k.k+'</span><span class="r">'+k.r+'</span>';
        el.missedGrid.appendChild(d);
      });
      el.drillBtn.classList.remove("hidden");
      el.drillBtn.textContent="Drill "+uniqMissed.length+" missed";
      el.drillBtn.onclick=()=>start(uniqMissed);
    }else{
      el.missedBlock.classList.add("hidden");
      el.drillBtn.classList.add("hidden");
    }
    el.againBtn.onclick=()=>start(KANA);
  }

  // ---------- mode + input wiring ----------
  function setMode(m){
    mode=m;
    el.modeType.classList.toggle("on", m==="type");
    el.modeChoose.classList.toggle("on", m==="choose");
    render();
  }

  el.submitBtn.addEventListener("click", submitType);
  el.revealBtn.addEventListener("click", reveal);
  el.input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); submitType(); } });
  document.addEventListener("keydown", e=>{
    if(mode==="choose" && !locked && /^[1-4]$/.test(e.key)){
      const b=el.choices.children[+e.key-1];
      if(b && b.classList.contains("choice")) b.click();
    }
    if(mode==="choose" && locked && e.key==="Enter"){
      const cont=el.choices.querySelector(".btn-primary"); if(cont) cont.click();
    }
  });
  el.modeType.addEventListener("click",()=>setMode("type"));
  el.modeChoose.addEventListener("click",()=>setMode("choose"));
  el.restartBtn.addEventListener("click",()=>start(KANA));

  start(KANA);
})();
</script>
</body>
</html>
